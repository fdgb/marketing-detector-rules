<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>营销号鉴别器 - 规则服务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f0f13;
      color: #e0e0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 90%;
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shield {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #dc2626, #f97316);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }
    .status-row:last-child { border-bottom: none; }
    .label { color: #888; }
    .value { font-weight: 600; }
    .value.ok { color: #22c55e; }
    .value.ver { color: #818cf8; }
    .api-box {
      margin-top: 24px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: #818cf8;
      word-break: break-all;
      line-height: 1.6;
    }
    .api-label {
      font-family: inherit;
      color: #666;
      font-size: 11px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="shield">🛡️</span> 营销号鉴别器</h1>
    <p class="subtitle">远程规则服务 · 规则热更新端点</p>

    <div class="status-row">
      <span class="label">服务状态</span>
      <span class="value ok">● 正常运行</span>
    </div>
    <div class="status-row">
      <span class="label">当前版本</span>
      <span class="value ver" id="version">加载中...</span>
    </div>
    <div class="status-row">
      <span class="label">最后更新</span>
      <span class="value" id="updatedAt">加载中...</span>
    </div>
    <div class="status-row">
      <span class="label">变更日志</span>
      <span class="value" id="changelog">加载中...</span>
    </div>

    <div class="api-box">
      <div class="api-label">Rules Endpoint</div>
      <div id="apiUrl">加载中...</div>
    </div>

    <p class="footer">营销号鉴别器浏览器扩展 · 规则自动热更新<br>无需重新安装即可获取最新检测规则</p>
  </div>

  <script>
    fetch('./rules.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('version').textContent = 'v' + (data.version || 1);
        document.getElementById('updatedAt').textContent = data.updatedAt
          ? new Date(data.updatedAt).toLocaleString('zh-CN')
          : '未知';
        document.getElementById('changelog').textContent = data.changelog || '—';
        const baseUrl = window.location.href.replace(/\/(index\.html)?$/, '');
        document.getElementById('apiUrl').textContent = baseUrl + '/rules.json';
      })
      .catch(() => {
        document.getElementById('version').textContent = '加载失败';
        document.getElementById('updatedAt').textContent = '—';
        document.getElementById('changelog').textContent = '—';
        document.getElementById('apiUrl').textContent = '加载失败';
      });
  </script>
</body>
</html>
